[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "artwall"
version = "0.1.0"
description = "Museum-art wallpapers for Linux desktops, curated by a local vision model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=11.0"]

[project.optional-dependencies]
test = ["hypothesis>=6.0,<7", "mypy>=1.10"]

[project.scripts]
artwall = "artwall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["artwall"]

[tool.mypy]
files = ["artwall"]
strict = true
python_version = "3.11"

# PyGObject comes from the system and ships no type information.
[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
